<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GoPark</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f7fa;
}

.container{
    text-align:center;
    background:white;
    padding:50px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    width:400px;
}

h1{
    color:#005EB8;
    margin-bottom:10px;
}

p{
    color:#666;
    margin-bottom:30px;
}

a{
    display:block;
    text-decoration:none;
    padding:12px;
    margin:15px 0;
    border-radius:8px;
    font-size:18px;
    font-weight:600;
}

.partner{
    background:#005EB8;
    color:white;
}

.customer{
    background:#00A651;
    color:white;
}

a:hover{
    transform:translateY(-2px);
}

</style>

</head>

<body>

<div class="container">

    <h1>🚗 GoPark</h1>

    <p>Select your role to continue</p>

    <a class="partner" href="partnerreg">
        Partner
    </a>

    <a class="customer" href="/customer/">
        Customer
    </a>

</div>

</body>
</html>
