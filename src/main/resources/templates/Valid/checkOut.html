<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Customer Check-In | GoPark</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#eef2f7;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:430px;
    background:#fff;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
    overflow:hidden;
}

.header{
    background:#005EB8;
    color:white;
    text-align:center;
    padding:25px;
}

.header h2{
    margin-bottom:8px;
}

.header p{
    font-size:14px;
    opacity:.9;
}

.content{
    padding:30px;
}

.error{
    background:#fdecea;
    color:#d32f2f;
    padding:10px;
    border-radius:8px;
    margin-bottom:18px;
    text-align:center;
    font-size:14px;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
    color:#333;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.input-group input:focus{
    outline:none;
    border-color:#005EB8;
    box-shadow:0 0 5px rgba(0,94,184,.3);
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#00A651;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#008d44;
}

.footer{
    text-align:center;
    margin-top:20px;
}

.footer a{
    text-decoration:none;
    color:#005EB8;
    font-weight:bold;
}

.footer a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="container">

    <div class="header">
        <h2>Customer Check-In</h2>
        <p>Enter the customer's vehicle number to verify the booking.</p>
    </div>

    <div class="content">

        <div class="error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/valid/checking}" method="get">

            <div class="input-group">
                <label>Vehicle Number</label>
                <input type="text"
                       id="vehicle"
                       name="vehicleNumber"
                       placeholder="Example: AP39AB1234"
                       style="text-transform:uppercase;"
                       required>
            </div>

            <button type="submit">
                Check Booking
            </button>

        </form>

        <div class="footer">
            <a th:href="@{/valid/}">
                ← Back
            </a>
        </div>

    </div>

</div>

<script>

document.getElementById("vehicle").addEventListener("input", function(){
    this.value = this.value.toUpperCase();
});

</script>

</body>
</html>
