<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<title>Cancel Booking | GoPark</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#eef2f7;
}

.card{

    width:430px;
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.12);

}

.logo{

    text-align:center;
    font-size:55px;
    margin-bottom:10px;

}

h2{

    text-align:center;
    color:#d32f2f;
    margin-bottom:10px;

}

.info{

    text-align:center;
    color:#666;
    margin-bottom:25px;
    line-height:1.6;

}

.note{

    background:#fff3f3;
    border-left:4px solid #d32f2f;
    padding:15px;
    border-radius:8px;
    color:#444;
    margin-bottom:20px;
    font-size:14px;

}

.input-box{

    width:100%;
    height:50px;
    border:1px solid #ccc;
    border-radius:8px;
    padding-left:15px;
    font-size:17px;
    outline:none;

}

.input-box:focus{

    border-color:#005EB8;
    box-shadow:0 0 8px rgba(0,94,184,.2);

}

.btn{

    width:100%;
    height:50px;
    margin-top:20px;
    background:#d32f2f;
    color:white;
    border:none;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;
    transition:.3s;

}

.btn:hover{

    background:#b71c1c;

}

.error{

    margin-top:15px;
    text-align:center;
    color:#d32f2f;
    font-weight:bold;

}

.footer{

    text-align:center;
    margin-top:25px;

}

.footer a{

    text-decoration:none;
    color:#005EB8;
    font-weight:bold;

}

.footer a:hover{

    text-decoration:underline;

}

</style>

</head>

<body>

<div class="card">

    <div class="logo">❌</div>

    <h2>Cancel Booking</h2>

    <p class="info">
        Enter your booking OTP to cancel the parking reservation.
    </p>

    <div class="note">
        <strong>Note:</strong><br><br>
        • Cancellation is allowed only before check-in.<br>
        • After successful cancellation, the parking slot will become available for others.
    </div>

    <form th:action="@{/customer/cancelled}" method="post">

        <input
            class="input-box"
            type="text"
            id="otp"
            name="otp"
            maxlength="5"
            placeholder="Enter Booking OTP"
            autofocus
            required>

        <button class="btn">
            Cancel Booking
        </button>

    </form>

    <div class="error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <div class="footer">
        <a th:href="@{/customer/home}">
            ← Back to Home
        </a>
    </div>

</div>

<script>

document.getElementById("otp").addEventListener("input", function () {
    this.value = this.value.replace(/[^0-9]/g, '');
});

</script>

</body>

</html>
