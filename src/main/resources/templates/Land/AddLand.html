<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<title>Add Parking Land | GoPark</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#eef2f7;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:700px;
    background:white;
    padding:35px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

h2{
    text-align:center;
    color:#005EB8;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
}

.input-group input,
.input-group textarea{

    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    resize:none;

}

.input-group input:focus,
.input-group textarea:focus{

    outline:none;
    border-color:#005EB8;
    box-shadow:0 0 5px rgba(0,94,184,.3);

}

#map{

    width:100%;
    height:400px;
    border-radius:10px;
    border:1px solid #ccc;

}

.location-status{

    margin-top:10px;
    font-weight:bold;
    color:green;

}

button{

    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#005EB8;
    color:white;
    font-size:16px;
    cursor:pointer;

}

button:hover{

    background:#004a91;

}

.back{

    text-align:center;
    margin-top:20px;

}

.back a{

    text-decoration:none;
    color:#005EB8;
    font-weight:bold;

}

</style>

</head>

<body>

<div class="container">

<h2>Add Parking Land</h2>

<p class="subtitle">
Select your parking location on the map
</p>

<form th:action="@{/land/added}" method="post">

<div class="input-group">
<label>Land Name</label>
<input type="text"
name="landName"
required>
</div>

<div class="input-group">
<label>City</label>
<input type="text"
name="city"
required>
</div>

<div class="input-group">
<label>Address</label>
<textarea
name="address"
rows="3"
required></textarea>
</div>

<div class="input-group">
<label>Landmark</label>
<input type="text"
name="landmark">
</div>

<div class="input-group">
<label>Pincode</label>
<input
type="text"
id="pincode"
name="pincode"
maxlength="6">
</div>

<div class="input-group">

<label>Select Parking Location</label>

<div id="map"></div>

</div>

<input
type="hidden"
id="latitude"
name="latitude">

<input
type="hidden"
id="longitude"
name="longitude">

<div id="status"
class="location-status">

Detecting your location...

</div>

<button type="submit">

Add Land

</button>

</form>

<div class="back">

<a th:href="@{/land/lands}">
← Back
</a>

</div>

</div>

<script>

// Only numbers for pincode
document.getElementById("pincode").addEventListener("input",function(){

    this.value=this.value.replace(/[^0-9]/g,'');

});

// Default Map (India)
var map=L.map('map').setView([20.5937,78.9629],5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{

    attribution:'© OpenStreetMap contributors',
    maxZoom:19

}).addTo(map);

var marker;

// Current Location
if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(

function(position){

    var lat=position.coords.latitude;
    var lng=position.coords.longitude;

    map.setView([lat,lng],17);

    marker=L.marker([lat,lng]).addTo(map);

    document.getElementById("latitude").value=lat;
    document.getElementById("longitude").value=lng;

    document.getElementById("status").innerHTML=
    "✔ Current location detected. Click another place if needed.";

},

function(){

    document.getElementById("status").style.color="red";
    document.getElementById("status").innerHTML=
    "Location permission denied. Please click your parking location on the map.";

}

);

}

// Click on map

map.on("click",function(e){

    if(marker){

        map.removeLayer(marker);

    }

    marker=L.marker(e.latlng).addTo(map);

    document.getElementById("latitude").value=e.latlng.lat;
    document.getElementById("longitude").value=e.latlng.lng;

    document.getElementById("status").style.color="green";
    document.getElementById("status").innerHTML=
    "✔ Parking location selected successfully.";

});

</script>

</body>

</html>
