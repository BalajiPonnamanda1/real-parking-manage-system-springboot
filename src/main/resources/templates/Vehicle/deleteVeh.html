<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<title>Delete Vehicle | GoPark</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#eef2f7;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:450px;
    background:#fff;
    padding:35px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

h2{
    text-align:center;
    color:#d32f2f;
    margin-bottom:10px;
}

.error-box{
    background:#ffe6e6;
    color:#c62828;
    border:1px solid #f5bcbc;
    padding:12px;
    border-radius:8px;
    margin-bottom:20px;
    text-align:center;
    font-size:14px;
    animation:fadeIn .3s ease;
}
.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
}

.input-group select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.input-group select:focus{
    outline:none;
    border-color:#005EB8;
    box-shadow:0 0 5px rgba(0,94,184,.3);
}

button{
    width:100%;
    padding:13px;
    background:#d32f2f;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#b71c1c;
}

.error{
    color:red;
    text-align:center;
    margin-bottom:15px;
}
.links{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
}

.links a{
    text-decoration:none;
    color:#005EB8;
    font-weight:bold;
}

.links a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="container">

<h2>Delete Vehicle</h2>

<p class="subtitle">
Select the vehicle type you want to remove.
</p>

<p class="error" th:if="${error}" th:text="${error}"></p>
<form th:action="@{/vehicle/deleted}" method="get">

    <div class="input-group">

        <label>Vehicle Type</label>

        <select name="vehicleType" required>
            <option value="">-- Select Vehicle Type --</option>
            <option value="Bike">🏍 Bike</option>
            <option value="Car">🚗 Car</option>
            <option value="Auto">🛺 Auto</option>
            <option value="Van">🚐 Van</option>
            <option value="Bus">🚌 Bus</option>
            <option value="Lorry">🚛 Lorry</option>
        </select>

    </div>

    <button type="submit">
        Delete Vehicle
    </button>

</form>

<div class="links">
    <a th:href="@{/vehicle/park}">← Vehicle Dashboard</a>
    <a th:href="@{/partner/Home}">🏠 Home</a>
</div>

</div>

</body>

</html>
