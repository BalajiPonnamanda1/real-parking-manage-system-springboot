<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<title>Update Land | GoPark</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#eef2f7;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:500px;
    background:white;
    padding:35px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

h2{
    text-align:center;
    color:#005EB8;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.input-group input:focus{
    outline:none;
    border-color:#005EB8;
    box-shadow:0 0 5px rgba(0,94,184,.3);
}

button{
    width:100%;
    padding:13px;
    background:#005EB8;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#004a91;
}

.back{
    text-align:center;
    margin-top:20px;
}

.back a{
    text-decoration:none;
    color:#005EB8;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h2>Update Land</h2>

<p class="subtitle">
Update your parking location details.
</p>

<form th:action="@{/land/updateLand}" method="post">

    <!-- Hidden ID -->
    <input type="hidden"
           name="landId"
           th:value="${data.landId}">

    <div class="input-group">
        <label>Land Name</label>
        <input type="text"
               name="landName"
               th:value="${data.landName}"
               required>
    </div>

    <div class="input-group">
        <label>City</label>
        <input type="text"
               name="city"
               th:value="${data.city}"
               required>
    </div>

    <div class="input-group">
        <label>Address</label>
        <input type="text"
               name="address"
               th:value="${data.address}"
               required>
    </div>

    <div class="input-group">
        <label>Landmark</label>
        <input type="text"
               name="landmark"
               th:value="${data.landmark}">
    </div>

    <div class="input-group">
        <label>Pincode</label>
        <input type="text"
               name="pincode"
               th:value="${data.pincode}">
    </div>

    <!-- Hidden Location -->
    <input type="hidden"
           name="latitude"
           th:value="${data.latitude}">

    <input type="hidden"
           name="longitude"
           th:value="${data.longitude}">

    <button type="submit">
        Update Land
    </button>

</form>

<div class="back">
    <a th:href="@{/land/show}">
        ← Back
    </a>
</div>

</div>

</body>

</html>
