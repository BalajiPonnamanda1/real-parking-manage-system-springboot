<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<title>My Reviews | GoPark</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#eef2f7;
    padding:40px;
}

.container{

    width:95%;
    max-width:1200px;
    margin:auto;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.12);

}

.header{

    background:#005EB8;
    color:white;
    text-align:center;
    padding:25px;

}

.header h2{

    margin-bottom:8px;

}

.header p{

    opacity:.9;

}

table{

    width:100%;
    border-collapse:collapse;

}

th{

    background:#005EB8;
    color:white;
    padding:14px;

}

td{

    padding:14px;
    text-align:center;
    border-bottom:1px solid #ddd;

}

tr:nth-child(even){

    background:#f8fbff;

}

tr:hover{

    background:#eef6ff;

}

.review{

    text-align:left;
    max-width:350px;
    word-wrap:break-word;

}

.rating{

    color:#ff9800;
    font-weight:bold;
    font-size:18px;

}

.action-btn{

    display:inline-block;
    text-decoration:none;
    padding:8px 16px;
    border-radius:6px;
    color:white;
    font-size:14px;
    font-weight:bold;
    background:#d32f2f;
    transition:.3s;

}

.action-btn:hover{

    background:#b71c1c;

}

.empty{

    text-align:center;
    padding:30px;
    color:#666;

}

.footer{

    text-align:center;
    padding:25px;

}

.home-btn{

    text-decoration:none;
    background:#005EB8;
    color:white;
    padding:12px 24px;
    border-radius:8px;
    font-weight:bold;

}

.home-btn:hover{

    background:#004a91;

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h2>My Reviews</h2>

<p>Manage your parking reviews.</p>

</div>

<table>

<tr>

<th>Owner</th>
<th>Parking Land</th>
<th>City</th>
<th>Review</th>
<th>Rating</th>
<th>Action</th>
<th>Delete</th>

</tr>

<tr th:if="${#lists.isEmpty(data)}">

<td colspan="6" class="empty">
No reviews found.
</td>

</tr>

<tr th:each="c : ${data}">

<td th:text="${c.booking.land.partner.partnerName}"></td>

<td th:text="${c.booking.land.landName}"></td>

<td th:text="${c.booking.land.city}"></td>

<td class="review" th:text="${c.review}"></td>

<td class="rating">
    <span th:each="i : ${#numbers.sequence(1,c.rating)}">⭐</span>
</td>

<td>

	<a th:href="@{/review/update/{id}(id=${c.reviewId})}">
	    ✏ Edit Review
	</a>

</td>

<td>

<a class="action-btn"
   th:href="@{/review/delete(id=${c.reviewId})}"
   onclick="return confirm('Are you sure you want to delete this review?')">

Delete

</a>

</td>

</tr>

</table>

<div class="footer">

<a href="/customer/home" class="home-btn">
🏠 Home
</a>

</div>

</div>

</body>

</html>
