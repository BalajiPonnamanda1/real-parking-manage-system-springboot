<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<title>Vehicle Details | GoPark</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#eef2f7;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:95%;
    max-width:1100px;
    background:white;
    padding:35px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

h2{
    text-align:center;
    color:#005EB8;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#005EB8;
    color:white;
    padding:14px;
}

td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f7fbff;
}

.update-btn{
    background:#ffc107;
    color:black;
    text-decoration:none;
    padding:8px 14px;
    border-radius:6px;
    margin-right:8px;
    font-weight:600;
}

.update-btn:hover{
    background:#e0a800;
}

.delete-btn{
    background:#dc3545;
    color:white;
    text-decoration:none;
    padding:8px 14px;
    border-radius:6px;
    font-weight:600;
}

.delete-btn:hover{
    background:#bb2d3b;
}

.links{
    display:flex;
    justify-content:space-between;
    margin-top:25px;
}

.links a{
    text-decoration:none;
    color:#005EB8;
    font-weight:bold;
}

.links a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="container">

<h2>Vehicle Details</h2>

<p class="subtitle">
Manage your parking vehicles.
</p>

<table>

<tr>
    <th>ID</th>
    <th>Land</th>
    <th>Vehicle</th>
    <th>Total Slots</th>
    <th>Available Slots</th>
    <th>Price / Hour</th>
    <th>Actions</th>
</tr>

<tr th:each="p : ${data}">

    <td th:text="${p.vehicleId}"></td>

    <td th:text="${p.land.landName}"></td>

    <td th:text="${p.vehicleType}"></td>

    <td th:text="${p.totalSlots}"></td>

    <td th:text="${p.availableSlots}"></td>

    <td>₹ <span th:text="${p.pricePerHour}"></span></td>

    <td>

        <a class="update-btn"
           th:href="@{/vehicle/update(id=${p.vehicleId})}">
            ✏ Update
        </a>

        <a class="delete-btn"
           th:href="@{/vehicle/delete(id=${p.vehicleId})}"
           onclick="return confirm('Are you sure you want to delete this vehicle?');">
            🗑 Delete
        </a>

    </td>

</tr>

</table>

<div class="links">

    <a th:href="@{/vehicle/park}">
        ← Vehicle Dashboard
    </a>

    <a th:href="@{/partner/Home}">
        🏠 Home
    </a>

</div>

</div>

</body>

</html>
