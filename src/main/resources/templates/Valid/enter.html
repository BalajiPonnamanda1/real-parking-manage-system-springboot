<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>OTP Verification | GoPark</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#eef2f7;
}

.card{
    width:420px;
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    font-size:50px;
    margin-bottom:10px;
}

h2{
    text-align:center;
    color:#005EB8;
    margin-bottom:10px;
}

.info{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.details{
    background:#f8f9fa;
    border-radius:8px;
    padding:15px;
    margin-bottom:20px;
    font-size:15px;
    color:#333;
}

.details p{
    margin:8px 0;
}

.input-box{
    width:100%;
    height:50px;
    padding-left:15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:17px;
    outline:none;
}

.input-box:focus{
    border-color:#005EB8;
    box-shadow:0 0 8px rgba(0,94,184,.2);
}

.btn{
    width:100%;
    height:50px;
    margin-top:20px;
    border:none;
    border-radius:8px;
    background:#005EB8;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.btn:hover{
    background:#004c96;
}

.error{
    margin-top:15px;
    padding:10px;
    border-radius:6px;
    background:#fdecea;
    color:#c62828;
    text-align:center;
}

.back{
    text-align:center;
    margin-top:20px;
}

.back a{
    text-decoration:none;
    color:#005EB8;
    font-weight:bold;
}

.footer{
    text-align:center;
    margin-top:25px;
    font-size:13px;
    color:#777;
}

</style>

</head>

<body>

<div class="card">

    <div class="logo">🚗</div>

    <h2>OTP Verification</h2>

    <p class="info">
        Verify the customer's booking to start parking.
    </p>

    <!-- Optional Details -->
   

    <form th:action="@{/valid/validate}" method="post">

        <input
            class="input-box"
            type="text"
            id="otp"
            name="otp"
            maxlength="5"
            placeholder="Enter OTP"
            autofocus
            required>

        <button class="btn">
            Verify OTP
        </button>

    </form>

    <div class="error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <div class="back">
        <a th:href="@{/valid/}">
            ← Back
        </a>
    </div>

    <div class="footer">
        GoPark Parking Management System
    </div>

</div>

<script>

const otp=document.getElementById("otp");

otp.addEventListener("input",function(){
    this.value=this.value.replace(/[^0-9]/g,'');
});

</script>

</body>
</html>
