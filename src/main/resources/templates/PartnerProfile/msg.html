
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GoPark | Message</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef5ff, #f8fbff);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }


        /* Main Card */

        .message-card {

            width: 100%;
            max-width: 500px;

            background: #ffffff;

            border-radius: 20px;

            padding: 45px 40px;

            text-align: center;

            box-shadow: 0 15px 45px rgba(0, 70, 140, 0.12);
        }


        /* Icon */

        .message-icon {

            width: 78px;
            height: 78px;

            margin: 0 auto 24px;

            border-radius: 50%;

            background: #e8f7ee;

            color: #16a34a;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 40px;
            font-weight: bold;
        }


        /* Message */

        .message {

            display: inline-block;

            padding: 15px 22px;

            margin-bottom: 30px;

            border-radius: 10px;

            background: #f0f7ff;

            border: 1px solid #cfe3f8;

            color: #005EB8;

            font-size: 20px;

            font-weight: 600;

            line-height: 1.5;
        }


        /* Buttons */

        .buttons {

            display: flex;

            gap: 12px;

            justify-content: center;
        }


        .btn {

            flex: 1;

            padding: 13px 18px;

            border-radius: 10px;

            text-decoration: none;

            font-size: 15px;

            font-weight: 600;

            transition: 0.25s;
        }


        /* Home */

        .home-btn {

            background: #005EB8;

            color: white;
        }

        .home-btn:hover {

            background: #004a91;

            transform: translateY(-1px);
        }


        /* Review */

        .review-btn {

            background: white;

            color: #005EB8;

            border: 1px solid #005EB8;
        }

        .review-btn:hover {

            background: #f2f7fc;

            transform: translateY(-1px);
        }


        /* Footer */

        .footer {

            margin-top: 28px;

            font-size: 12px;

            color: #98a2b3;
        }


        /* Mobile */

        @media (max-width: 500px) {

            .message-card {

                padding: 35px 25px;
            }

            .message {

                font-size: 17px;

                padding: 13px 16px;
            }

            .buttons {

                flex-direction: column;
            }

            .btn {

                width: 100%;
            }

        }

    </style>

</head>


<body>


<div class="message-card">


    <!-- Generic Message Icon -->

    <div class="message-icon">

        ✓

    </div>


    <!-- Dynamic Message -->

    <div class="message"
         th:text="${msg}">

        Your action was completed successfully.

    </div>


    <!-- Navigation -->

    <div class="buttons">


        <a href="/partner/Home"
           class="btn home-btn">

            🏠 Home

        </a>
    </div>


    <!-- Footer -->

    <div class="footer">

        Thank you for using GoPark.

    </div>


</div>


</body>

</html>
