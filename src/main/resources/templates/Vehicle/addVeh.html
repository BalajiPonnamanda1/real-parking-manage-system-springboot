<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Add Vehicle | GoPark</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#eef2f7;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:480px;
    background:white;
    padding:35px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

h2{
    text-align:center;
    color:#005EB8;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.error{
    background:#ffe6e6;
    color:#d93025;
    border:1px solid #ffb3b3;
    border-radius:8px;
    padding:10px;
    margin-bottom:20px;
    text-align:center;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
}

.input-group input,
.input-group select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.input-group input:focus,
.input-group select:focus{
    outline:none;
    border-color:#005EB8;
    box-shadow:0 0 5px rgba(0,94,184,.3);
}

button{
    width:100%;
    padding:13px;
    background:#005EB8;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#004b91;
}

.error{
    color:red;
    text-align:center;
    margin-bottom:15px;
}

.links{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
}

.links a{
    text-decoration:none;
    color:#005EB8;
    font-weight:bold;
}

.links a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="container">

<h2>Add Vehicle</h2>

<p class="subtitle">
Add a new parking vehicle category.
</p>

<div class="error" th:if="${error}" th:text="${error}"></div>

<form th:action="@{/vehicle/added}" method="post">

    <div class="input-group">
        <label>Vehicle Type</label>

        <select name="vehicleType" required>
            <option value="">-- Select Vehicle Type --</option>
            <option value="Bike">🏍 Bike</option>
            <option value="Car">🚗 Car</option>
            <option value="Auto">🛺 Auto</option>
            <option value="Van">🚐 Van</option>
            <option value="Bus">🚌 Bus</option>
            <option value="Lorry">🚛 Lorry</option>
        </select>

    </div>

    <div class="input-group">
        <label>Total Slots</label>

        <input type="number"
               id="totalSlots"
               name="totalSlots"
               min="1"
               placeholder="Enter Total Slots"
               required>

    </div>

    <div class="input-group">
        <label>Available Slots</label>

        <input type="number"
               id="availableSlots"
               name="availableSlots"
               min="0"
               placeholder="Enter Available Slots"
               required>

    </div>

    <div class="input-group">
        <label>Price Per Hour (₹)</label>

        <input type="number"
               name="pricePerHour"
               min="1"
               placeholder="Enter Price Per Hour"
               required>

    </div>

    <button type="submit">
        Add Vehicle
    </button>

</form>

<div class="links">
    <a th:href="@{/vehicle/park}">← Vehicle Dashboard</a>
    <a th:href="@{/partner/Home}">Home</a>
</div>

</div>

<script>

const total = document.getElementById("totalSlots");
const available = document.getElementById("availableSlots");

available.addEventListener("input",function(){

    let totalSlots = parseInt(total.value) || 0;
    let availableSlots = parseInt(this.value) || 0;

    if(availableSlots > totalSlots){
        alert("Available slots cannot be greater than Total slots.");
        this.value = totalSlots;
    }

});

</script>

</body>

</html>
