
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GoPark | Success</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef5ff, #f8fbff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .success-card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 20px;
            padding: 45px 40px;
            text-align: center;
            box-shadow: 0 15px 45px rgba(0, 70, 140, 0.12);
        }

        /* Success Icon */

        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: #e8f7ee;
            color: #16a34a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
            font-weight: bold;
        }

        /* Heading */

        h1 {
            color: #1d2939;
            font-size: 26px;
            margin-bottom: 12px;
        }

        /* Message */

        .message {
            color: #667085;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        /* Buttons */

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            flex: 1;
            padding: 13px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: 0.25s;
        }

        .home-btn {
            background: #005EB8;
            color: white;
        }

        .home-btn:hover {
            background: #004a91;
            transform: translateY(-1px);
        }

        .review-btn {
            background: white;
            color: #005EB8;
            border: 1px solid #005EB8;
        }

        .review-btn:hover {
            background: #f2f7fc;
            transform: translateY(-1px);
        }

        /* Footer */

        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: #98a2b3;
        }

        /* Mobile */

        @media (max-width: 500px) {

            .success-card {
                padding: 35px 25px;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>

<div class="success-card">

    <!-- Success Icon -->

    <div class="success-icon">
        ✓
    </div>


    <!-- Heading -->

    <h1>
        Successfully Updated!
    </h1>


    <!-- Dynamic Message -->

    <p class="message"
       th:text="${msg}">
        Your review has been updated successfully.
    </p>


    <!-- Navigation Buttons -->

    <div class="buttons">

        <a href="/partner/Home"
           class="btn home-btn">
            🏠 Home
        </a>

        <a href="/vehicle/"
           class="btn review-btn">
            ⭐ Vehicle
        </a>

    </div>


    <!-- Footer -->

    <div class="footer">

        Thank you for using GoPark.

    </div>

</div>

</body>

</html>
