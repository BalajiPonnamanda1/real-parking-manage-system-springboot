<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Customer Sign Up | GoPark</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#eef2f7;
}

.container{
    width:420px;
    background:white;
    padding:35px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.error-box{
    background:#ffe6e6;
    color:#c62828;
    border:1px solid #f5bcbc;
    padding:12px;
    border-radius:8px;
    margin-bottom:20px;
    text-align:center;
    font-size:14px;
    animation:fadeIn .3s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(-8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h2{
    text-align:center;
    color:#005EB8;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:16px;
}

.input-group label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.input-group input:focus{
    outline:none;
    border-color:#005EB8;
    box-shadow:0 0 5px rgba(0,94,184,.3);
}

.show-password{
    display:flex;
    align-items:center;
    margin-bottom:15px;
}

.show-password input{
    width:auto;
    margin-right:8px;
}

.error{
    color:red;
    font-size:14px;
    text-align:center;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:13px;
    background:#005EB8;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#004a91;
}

.footer{
    text-align:center;
    margin-top:20px;
}

.footer a{
    text-decoration:none;
    color:#005EB8;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

    <h2>Create Account</h2>
    <p class="subtitle">Join GoPark today</p>

    <p id="error" class="error"></p>

    <form id="signupForm" th:action="@{/customer/signData}" method="post">

		<div class="error-box"
		     th:if="${error}"
		     th:text="${error}">
		</div>
        <div class="input-group">
            <label>Name</label>
            <input type="text"
                   name="customerName"
                   placeholder="Enter your name"
                   required>
        </div>

        <div class="input-group">
            <label>Mobile Number</label>
            <input type="text"
                   id="mobile"
                   name="mobileNumber"
                   maxlength="10"
                   placeholder="Enter mobile number"
                   required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Enter password"
                   required>
        </div>

        <div class="input-group">
            <label>Confirm Password</label>
            <input type="password"
                   id="confirmPassword"
                   placeholder="Confirm password"
                   required>
        </div>

        <div class="show-password">
            <input type="checkbox" id="showPassword">
            <label for="showPassword">Show Passwords</label>
        </div>

        <button type="submit">Create Account</button>

    </form>

    <div class="footer">
        Already have an account?
        <a th:href="@{/customer/login}">Login</a>
    </div>

</div>

<script>

// Mobile number validation
document.getElementById("mobile").addEventListener("input", function () {
    this.value = this.value.replace(/[^0-9]/g, '');
});

// Show Password
document.getElementById("showPassword").addEventListener("change", function () {

    let type = this.checked ? "text" : "password";

    document.getElementById("password").type = type;
    document.getElementById("confirmPassword").type = type;

});

// Password Validation
document.getElementById("signupForm").addEventListener("submit", function(e){

    const pass = document.getElementById("password").value;
    const confirm = document.getElementById("confirmPassword").value;
    const error = document.getElementById("error");

    if(pass !== confirm){

        e.preventDefault();
        error.innerHTML = "Passwords do not match!";
        return;

    }

});

</script>

</body>
</html>
