<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Partner Registration | GoPark</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#eef2f7;
}

.container{
    width:430px;
    background:#fff;
    padding:35px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

h2{
    text-align:center;
    color:#005EB8;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.error{
    color:red;
    text-align:center;
    margin-bottom:15px;
}

.input-group{
    margin-bottom:16px;
}

.input-group label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.input-group input:focus{
    outline:none;
    border-color:#005EB8;
    box-shadow:0 0 5px rgba(0,94,184,.3);
}

.show-password{
    display:flex;
    align-items:center;
    margin-bottom:20px;
}

.show-password input{
    width:auto;
    margin-right:8px;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#005EB8;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#004a91;
}

.footer{
    text-align:center;
    margin-top:20px;
}

.footer a{
    text-decoration:none;
    color:#005EB8;
    font-weight:bold;
}

.footer a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="container">

    <h2>Partner Registration</h2>

    <p class="subtitle">
        Register your parking space with GoPark.
    </p>

    <p id="error" class="error"></p>

    <form id="partnerForm" th:action="@{/partner/signData}" method="post">

        <div class="input-group">
            <label>Partner Name</label>
            <input
                type="text"
                name="partnerName"
                placeholder="Enter your name"
                required>
        </div>

        <div class="input-group">
            <label>Mobile Number</label>
            <input
                type="text"
                id="mobile"
                name="mobileNumber"
                maxlength="10"
                placeholder="Enter mobile number"
                required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required>
        </div>

        <div class="input-group">
            <label>Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                required>
        </div>

        <div class="show-password">
            <input type="checkbox" id="showPassword">
            <label for="showPassword">Show Passwords</label>
        </div>

        <button type="submit">
            Register
        </button>

    </form>

    <div class="footer">
        Already have an account?
        <a th:href="@{/partnerlogin}">
            Login
        </a>
    </div>

</div>

<script>

// Mobile Number Validation
document.getElementById("mobile").addEventListener("input",function(){

    this.value=this.value.replace(/[^0-9]/g,'');

});

// Show Password
document.getElementById("showPassword").addEventListener("change",function(){

    let type=this.checked ? "text" : "password";

    document.getElementById("password").type=type;
    document.getElementById("confirmPassword").type=type;

});

// Password Validation
document.getElementById("partnerForm").addEventListener("submit",function(e){

    let pass=document.getElementById("password").value;
    let confirm=document.getElementById("confirmPassword").value;

    if(pass!==confirm){

        e.preventDefault();
        document.getElementById("error").innerHTML="Passwords do not match!";
        return;

    }

});

</script>

</body>
</html>
