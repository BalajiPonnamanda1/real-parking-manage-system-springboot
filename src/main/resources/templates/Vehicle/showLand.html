<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<title>Select Land | GoPark</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#eef2f7;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:900px;
    background:white;
    padding:35px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

h2{
    text-align:center;
    color:#005EB8;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#005EB8;
    color:white;
    padding:14px;
}

td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f7fbff;
}

.select-btn{
    text-decoration:none;
    background:#28a745;
    color:white;
    padding:8px 18px;
    border-radius:6px;
    font-weight:bold;
    transition:.3s;
}

.select-btn:hover{
    background:#218838;
}

.links{
    display:flex;
    justify-content:space-between;
    margin-top:25px;
}

.links a{
    text-decoration:none;
    color:#005EB8;
    font-weight:bold;
}

.links a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="container">

<h2>Select Land</h2>

<p class="subtitle">
Choose a land to manage its parking vehicles.
</p>

<table>

<tr>
    <th>Land ID</th>
    <th>Land Name</th>
    <th>City</th>
    <th>Action</th>
</tr>

<tr th:each="c : ${data}">

    <td th:text="${c.landId}"></td>

    <td th:text="${c.landName}"></td>

    <td th:text="${c.city}"></td>

    <td>
        <a class="select-btn"
           th:href="@{/vehicle/Land(id=${c.landId})}">
            Select
        </a>
    </td>

</tr>

</table>

<div class="links">

    <a th:href="@{/partner/Home}">
        🏠 Home
    </a>

</div>

</div>

</body>

</html>
